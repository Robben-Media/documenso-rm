name: Robben Media Retry-Backoff Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retry_backoff_test:
    name: Retry-backoff regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-install
      - run: npm test -w @documenso/lib -- --run jobs/client/retry.test.ts

  build_and_publish:
    if: github.event_name == 'push'
    name: Build Linux amd64 image artifact
    needs: retry_backoff_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/documenso-rm-retry-backoff.tar
          tags: documenso-rm:retry-backoff-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: documenso-rm-retry-backoff-image
          path: /tmp/documenso-rm-retry-backoff.tar
          retention-days: 7
