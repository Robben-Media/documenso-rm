name: Robben Media Retry-Backoff Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retry_backoff_test:
    name: Retry-backoff regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-install
      - run: npm test -w @documenso/lib -- --run jobs/client/retry.test.ts

  build_and_publish:
    name: Build Linux amd64 image
    needs: retry_backoff_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robben-media/documenso-rm:retry-backoff-${{ github.sha }}
